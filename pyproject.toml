[project]
name = "debatabase"
version = "0.0.1"
description = "Searchable database of policy debate evidence cards."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "voyageai>=0.3",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debatabase"]

[tool.ruff]
line-length = 100
target-version = "py312"
