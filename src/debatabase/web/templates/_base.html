<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}debatabase{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="/">debatabase</a>
    <nav>
      <a href="/search">Search</a>
      <a href="/tags">Tags</a>
      <a href="/sources">Sources</a>
      <a href="/analyticals">Analyticals</a>
      {% if request.session.get('user_id') %}
        <a href="/workspaces">Workspaces</a>
        <a href="/admin/proposed-tags">Review</a>
        <a href="/admin/duplicates">Duplicates</a>
      {% endif %}
    </nav>
    <div class="auth-status">
      {% if request.session.get('user_id') %}
        <span class="auth-nick">{{ request.session.get('user_nick') }}</span>
        <form method="post" action="/logout" style="display:inline">
          <button type="submit" class="auth-logout">logout</button>
        </form>
      {% else %}
        <a href="/login">login</a>
        <a href="/register">register</a>
      {% endif %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
